name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "js/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        # npm bug (https://github.com/npm/cli/issues/4828) drops platform-specific
        # optional deps when lockfile is generated on another OS. Remove lockfile +
        # lockdir so rollup's linux-x64-gnu native binary gets picked up on CI.
        run: |
          rm -rf node_modules package-lock.json js/node_modules web/node_modules
          npm install

      - name: Build admdongkor (js)
        working-directory: js
        run: npm run build

      - name: Build web (Next.js static export)
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
