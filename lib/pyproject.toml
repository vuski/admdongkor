[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admdongkor"
version = "0.6.0"
description = "Korea administrative boundary parquet downloader + 시계열 영역 매칭 (읍면동/시군구/시도, 1975–2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vuski" }]
requires-python = ">=3.10"
keywords = ["korea", "administrative-boundary", "geopandas", "gis", "읍면동"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=1.0",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/vuski/admdongkor"
Issues = "https://github.com/vuski/admdongkor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/admdongkor"]
# 인덱스 parquet (src/admdongkor/data/) 은 wheel 에 embed 하지 않는다 —
# import 시 _cache.ensure_latest() 가 GitHub dist/data/ 에서 받아
# 사용자 캐시 디렉토리에 저장한다. 데이터만 수정할 땐 PyPI 재배포 불필요.
exclude = [
    "src/admdongkor/data/*.parquet",
    "src/admdongkor/data",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/admdongkor/data/*.parquet",
    "src/admdongkor/data",
]
