[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admdongkor"
version = "0.5.6"
description = "Korea administrative boundary parquet downloader + 시계열 영역 매칭 (읍면동/시군구/시도, 1975–2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vuski" }]
requires-python = ">=3.10"
keywords = ["korea", "administrative-boundary", "geopandas", "gis", "읍면동"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=1.0",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/vuski/admdongkor"
Issues = "https://github.com/vuski/admdongkor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/admdongkor"]
# data/*.parquet 은 packages 설정에 포함되어 wheel 에 embed 됨
